
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Watch Placement Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f0ff;
            text-align: center;
            padding: 20px;
        }

        .controls {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        .control {
            margin: 15px 0;
        }

        input[type="range"] {
            width: 75%;
        }

        canvas {
            display: none;
            width: 100%;
            max-width: 900px;
            height: auto;
            margin: 20px auto;
            border: 1px solid #aaa;
            background: white;
        }

        button {
            background: #6554b3;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Virtual Watch Placement Test</h2>

    <div class="controls">
        <h3>Adjust Watch Placement</h3>

        <p>Upload Wrist Image:</p>
        <input type="file" id="wristUpload"
               accept="image/png,image/jpeg">

        <p>Upload Watch Image:</p>
        <input type="file" id="watchUpload"
               accept="image/png">

        <div class="control">
            Horizontal Position:
            <span id="xValue">40</span>%
            <input type="range" id="x"
                   min="0" max="100" value="40">
        </div>

        <div class="control">
            Vertical Position:
            <span id="yValue">75</span>%
            <input type="range" id="y"
                   min="0" max="100" value="75">
        </div>

        <div class="control">
            Watch Size:
            <span id="sizeValue">18</span>%
            <input type="range" id="size"
                   min="3" max="45" value="18">
        </div>

        <div class="control">
            Rotation:
            <span id="angleValue">0</span>°
            <input type="range" id="angle"
                   min="-180" max="180" value="0">
        </div>

        <button id="tryOnBtn">Try On Watch</button>
        <button id="downloadBtn" disabled>
            Download Preview
        </button>

        <p id="status">Click Try On Watch to generate preview.</p>
    </div>

    <canvas id="previewCanvas"></canvas>

    <script src="js/watchPlacement.js"></script>

    <script>
        const canvas =
            document.getElementById("previewCanvas");

        const status =
            document.getElementById("status");

        const tryOnBtn =
            document.getElementById("tryOnBtn");

        const downloadBtn =
            document.getElementById("downloadBtn");

        const wristUpload =
            document.getElementById("wristUpload");

        const watchUpload =
            document.getElementById("watchUpload");

        let wristSource = "assets/wrist.jpg";
        let watchSource = "assets/watch.png";

        let imageWidth = 0;
        let imageHeight = 0;

        let wristObjectURL = null;
        let watchObjectURL = null;

        let previewReady = false;
        let requestVersion = 0;

        const controls = ["x", "y", "size", "angle"];

        function getValue(id) {
            return Number(
                document.getElementById(id).value
            );
        }

        // Hide the old preview when inputs change.
        function clearPreview() {
            requestVersion++;
            previewReady = false;
            downloadBtn.disabled = true;

            canvas.style.display = "none";

            const ctx = canvas.getContext("2d");

            if (ctx) {
                ctx.clearRect(
                    0, 0, canvas.width, canvas.height
                );
            }

            status.textContent =
                "Preview cleared. Click Try On Watch.";
        }

        // Generate a fresh preview.
        async function updateWatch() {
            const currentRequest = ++requestVersion;

            previewReady = false;
            downloadBtn.disabled = true;
            tryOnBtn.disabled = true;
            canvas.style.display = "none";

            status.textContent = "Processing...";

            try {
                const wristImage =
                    await loadImage(wristSource);

                const watchImage =
                    await loadImage(watchSource);

                if (currentRequest !== requestVersion) {
                    return;
                }

                imageWidth = wristImage.naturalWidth;
                imageHeight = wristImage.naturalHeight;

                const wristData = {
                    x: imageWidth * getValue("x") / 100,
                    y: imageHeight * getValue("y") / 100,
                    width: imageWidth * getValue("size") / 100,
                    angle: getValue("angle") *
                           Math.PI / 180
                };

                // Temporary canvas prevents an older result
                // from replacing the newest preview.
                const temporaryCanvas =
                    document.createElement("canvas");

                await placeWatch(
                    temporaryCanvas,
                    wristSource,
                    watchSource,
                    wristData
                );

                if (currentRequest !== requestVersion) {
                    return;
                }

                canvas.width = temporaryCanvas.width;
                canvas.height = temporaryCanvas.height;

                const ctx = canvas.getContext("2d");
                ctx.clearRect(
                    0, 0, canvas.width, canvas.height
                );

                ctx.drawImage(temporaryCanvas, 0, 0);

                canvas.style.display = "block";
                previewReady = true;
                downloadBtn.disabled = false;

                status.textContent =
                    "New preview generated successfully!";

            } catch (error) {
                if (currentRequest === requestVersion) {
                    status.textContent = error.message;
                    canvas.style.display = "none";
                }
            } finally {
                if (currentRequest === requestVersion) {
                    tryOnBtn.disabled = false;
                }
            }
        }

        // Sliders used only for testing.
        controls.forEach(id => {
            const slider = document.getElementById(id);

            const valueLabel =
                document.getElementById(
                    id === "size" ? "sizeValue" :
                    id === "angle" ? "angleValue" :
                    id + "Value"
                );

            slider.addEventListener("input", () => {
            valueLabel.textContent = slider.value;

            if (previewReady) {
                updateWatch();
            }
        });
        });


        tryOnBtn.addEventListener("click", async () => {
        if (previewReady) {
        // Existing try-on completed: start fresh.
            clearPreview();
            wristUpload.value = "";
            watchUpload.value = "";
            status.textContent =
            "Previous preview cleared. Choose a new watch.";
            return;
    }

    // Generate the next try-on.
    await updateWatch();
});

        // Download only the latest valid preview.
        downloadBtn.addEventListener("click", () => {
            if (!previewReady) {
                status.textContent =
                    "Generate a preview first.";
                return;
            }

            const imageURL =
                canvas.toDataURL("image/png");

            const link = document.createElement("a");

            link.href = imageURL;
            link.download =
                "virtual-watch-preview.png";

            link.click();
        });

        // Handle wrist image upload.
        wristUpload.addEventListener(
            "change", async () => {

            const file = wristUpload.files[0];
            if (!file) return;

            if (!["image/jpeg", "image/png"]
                .includes(file.type)) {

                status.textContent =
                    "Select a JPG or PNG wrist image.";

                wristUpload.value = "";
                return;
            }

            const newURL = URL.createObjectURL(file);

            try {
                const image = await loadImage(newURL);

                const oldURL = wristObjectURL;

                wristSource = newURL;
                wristObjectURL = newURL;

                imageWidth = image.naturalWidth;
                imageHeight = image.naturalHeight;

                clearPreview();

                if (oldURL) URL.revokeObjectURL(oldURL);

            } catch (error) {
                URL.revokeObjectURL(newURL);
                status.textContent =
                    "Unable to load wrist image.";
            }
        });

        // Handle watch image upload.
        watchUpload.addEventListener(
            "change", async () => {

            const file = watchUpload.files[0];
            if (!file) return;

            if (file.type !== "image/png") {
                status.textContent =
                    "Select a PNG watch image.";

                watchUpload.value = "";
                return;
            }

            const newURL = URL.createObjectURL(file);

            try {
                await loadImage(newURL);

                const oldURL = watchObjectURL;

                watchSource = newURL;
                watchObjectURL = newURL;

                clearPreview();

                if (oldURL) URL.revokeObjectURL(oldURL);

            } catch (error) {
                URL.revokeObjectURL(newURL);
                status.textContent =
                    "Unable to load watch image.";
            }
        });

        // Load the default wrist dimensions.
        async function initialize() {
            try {
                const image = await loadImage(wristSource);

                imageWidth = image.naturalWidth;
                imageHeight = image.naturalHeight;

            } catch (error) {
                status.textContent = error.message;
            }
        }

        initialize();
    </script>

</body>
</html>
